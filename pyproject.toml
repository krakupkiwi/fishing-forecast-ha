[project]
name = "fishing-forecast-ha"
version = "0.1.0"
description = "Home Assistant custom integration + Lovelace card for land-based fishing forecasting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "Sam" }]

# Runtime dependency of the *integration* is declared in
# custom_components/fishing_forecast/manifest.json (Home Assistant installs it).
# It is duplicated here so the core scoring library and tests can run stand-alone.
dependencies = [
    "ephem==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "syrupy>=4.6",
    "ruff>=0.9",
    "mypy>=1.13",
    "aioresponses>=0.7",
    "freezegun>=1.5",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PL", "ASYNC", "DTZ"]
ignore = [
    "PLR2004", # magic values are pervasive in scoring tables; keep them readable
    "RUF002", # en dashes in docstrings/tables are intentional
    "RUF003",
]

[tool.ruff.lint.pylint]
# The scoring engine legitimately takes many independent inputs per hour.
max-args = 9
max-positional-args = 9

[tool.ruff.lint.per-file-ignores]
# Test skeletons deliberately import lazily so skipped Phase-2 tests don't fail at
# collection before the modules they target exist.
"tests/*" = ["PLR2004", "S101", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.fishing_forecast"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# Strict typing is enforced on the shipped integration only.
files = ["custom_components"]

# Home Assistant and ephem are untyped-ish in places; loosen only where needed.
[[tool.mypy.overrides]]
module = ["ephem", "homeassistant.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
