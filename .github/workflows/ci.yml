name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest --cov=custom_components/fishing_forecast --cov-report=term-missing

  # hassfest + HACS validation are added in Phase 3, once __init__.py / config_flow.py
  # are real (they currently pass hassfest's manifest checks but not its code checks).
