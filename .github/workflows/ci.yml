name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (lint + type + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy (scoring core)
        run: mypy
      - name: pytest (scoring core)
        run: pytest --cov=custom_components/fishing_forecast --cov-report=term-missing

  integration:
    name: home assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ha]"
      - name: pytest (integration)
        run: pytest tests/integration -p no:randomly

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
